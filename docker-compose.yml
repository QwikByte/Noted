services:
  noted:
    build:
      context: .
      args:
        # Setzt scripts/auto-update.sh; bei manuellem Build optional, z. B. APP_VERSION=v1.2.0 docker compose build
        APP_VERSION: ${APP_VERSION:-}
        GIT_COMMIT: ${GIT_COMMIT:-}
    image: noted:latest
    container_name: noted
    restart: unless-stopped
    # Nur lokal erreichbar – davor gehört ein Reverse Proxy mit HTTPS (siehe README).
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - path: .env
        required: false
    environment:
      UPDATE_REQUEST_DIR: /app/.update-requests
    volumes:
      - noted-data:/data
      # Automatische Updates (scripts/auto-update.sh): Status nur lesend, für Administration → System …
      - ./.update:/app/.update:ro
      # … und ein Ordner, in dem der Button „Jetzt nach Updates suchen“ eine Anfrage ablegt
      - ./.update/requests:/app/.update-requests

volumes:
  noted-data:
